<!DOCTYPE html>
<html style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Legion Tactics Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; position: fixed; font-family: sans-serif; }
        #app { display: flex; flex-direction: column; height: 100%; width: 100%; }
        
        #court-wrapper { 
            position: relative; flex: 1; width: 100%;
            background-image: url('basketbolnaya-ploshchadka.jpg');
            background-size: contain; background-repeat: no-repeat; background-position: center;
        }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; }

        #toolbar { background: #1a1a1a; display: flex; justify-content: space-around; padding: 10px; border-bottom: 1px solid #333; }
        .tool-btn { padding: 8px; border-radius: 5px; border: 1px solid #444; background: #222; color: white; font-size: 18px; }
        .tool-btn.active { border-color: #ff6b00; background: #333; }

        #controls-area { background: #111; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        #player-controls { display: none; flex-direction: column; gap: 5px; padding: 10px; border-top: 1px solid #333; }
        .row { display: flex; justify-content: space-around; align-items: center; color: white; font-size: 14px; }
        input[type=range] { flex: 1; margin: 0 10px; accent-color: #ff6b00; }
        
        #main-nav { height: 70px; display: flex; justify-content: space-around; align-items: center; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; background: #333; color: white; font-weight: bold; }
        .btn-orange { background: #ff6b00; }
    </style>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <button class="tool-btn active" id="t-move" onclick="setTool('move')">🖐️ Игрок</button>
            <button class="tool-btn" id="t-ball" onclick="setTool('ball')">🏀 Мяч</button>
            <button class="tool-btn" id="t-screen" onclick="setTool('screen')">┳ Заслон</button>
        </div>

        <div id="court-wrapper"><canvas id="court"></canvas></div>
        
        <div id="controls-area">
            <div id="player-controls">
                <div class="row">
                    <span id="curr">0.0s</span>
                    <input type="range" id="timeline" value="0" oninput="seek(this.value)">
                    <span id="total">0.0s</span>
                </div>
                <div class="row">
                    <button class="btn btn-orange" id="play-btn" onclick="togglePlay()">▶ ПУСК</button>
                    <button class="btn" onclick="location.reload()">🔄 СБРОС</button>
                </div>
            </div>
            <div id="main-nav">
                <button class="btn" id="rec-btn" onclick="toggleRec()">⏺ ЗАПИСЬ</button>
                <button class="btn btn-orange" onclick="saveData()">💾 СОХРАНИТЬ</button>
            </div>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    const canvas = document.getElementById('court');
    const ctx = canvas.getContext('2d');
    
    let tool = 'move';
    let players = [
        { id: 1, x: 0.5, y: 0.8, label: '1' }, { id: 2, x: 0.3, y: 0.7, label: '2' },
        { id: 3, x: 0.7, y: 0.7, label: '3' }, { id: 4, x: 0.2, y: 0.4, label: '4' },
        { id: 5, x: 0.8, y: 0.4, label: '5' }
    ];
    let ballPos = { x: 0.5, y: 0.75, parentId: 1 };
    let screens = []; // Заслоны: {x, y, angle}
    let recordedFrames = [];
    let isRec = false; let isPlay = false; let currentIdx = 0; let selected = null;

    function setTool(t) {
        tool = t;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('t-' + t).classList.add('active');
    }

    function render(pos, currentScreens = []) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Рисуем заслоны
        currentScreens.forEach(s => {
            ctx.save();
            ctx.translate(s.x * canvas.width, s.y * canvas.height);
            ctx.rotate(s.angle);
            ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(0, 15);
            ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 4; ctx.stroke();
            ctx.restore();
        });

        // Рисуем игроков
        pos.forEach(p => {
            const px = p.x * canvas.width; const py = p.y * canvas.height;
            ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI*2);
            ctx.fillStyle = "#ff6b00"; ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
            ctx.fillText(p.label, px, py + 6);
        });

        // Рисуем мяч
        const bX = (ballPos.parentId ? pos.find(p=>p.id===ballPos.parentId).x : ballPos.x) * canvas.width;
        const bY = (ballPos.parentId ? pos.find(p=>p.id===ballPos.parentId).y : ballPos.y) * canvas.height;
        ctx.beginPath(); ctx.arc(bX + 15, bY - 15, 8, 0, Math.PI*2);
        ctx.fillStyle = "#f39c12"; ctx.fill(); ctx.stroke();
    }

    function getTouch(e) {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: (t.clientX - r.left) / canvas.width, y: (t.clientY - r.top) / canvas.height };
    }

    canvas.addEventListener('touchstart', (e) => {
        if (isPlay) return;
        const p = getTouch(e);
        if (tool === 'move') {
            selected = players.find(pl => Math.hypot(pl.x - p.x, pl.y - p.y) < 0.1);
        } else if (tool === 'ball') {
            const nearPlayer = players.find(pl => Math.hypot(pl.x - p.x, pl.y - p.y) < 0.1);
            if (nearPlayer) ballPos.parentId = nearPlayer.id;
        } else if (tool === 'screen') {
            screens.push({ x: p.x, y: p.y, angle: 0 });
            selected = screens[screens.length - 1];
        }
        if (selected) tg.HapticFeedback.impactOccurred('light');
        e.preventDefault();
    }, {passive: false});

    canvas.addEventListener('touchmove', (e) => {
        if (!selected || isPlay) return;
        const p = getTouch(e);
        selected.x = p.x; selected.y = p.y;
        render(players, screens);
        e.preventDefault();
    }, {passive: false});

    canvas.addEventListener('touchend', () => { selected = null; });

    function toggleRec() {
        isRec = !isRec;
        const btn = document.getElementById('rec-btn');
        btn.innerText = isRec ? "⏹ СТОП" : "⏺ ЗАПИСЬ";
        btn.style.background = isRec ? "#e74c3c" : "#333";
        if (!isRec) {
            document.getElementById('player-controls').style.display = "flex";
            document.getElementById('timeline').max = recordedFrames.length - 1;
            document.getElementById('total').innerText = (recordedFrames.length * 0.04).toFixed(1) + "s";
        } else { recordedFrames = []; screens = []; }
    }

    setInterval(() => { 
        if(isRec) recordedFrames.push({ pos: players.map(p => ({...p})), sc: screens.map(s => ({...s})) }); 
    }, 40);

    function togglePlay() {
        isPlay = !isPlay;
        document.getElementById('play-btn').innerText = isPlay ? "⏸ ПАУЗА" : "▶ ПУСК";
        if (isPlay) playAnim();
    }

    function playAnim() {
        if (currentIdx >= recordedFrames.length) currentIdx = 0;
        const interval = setInterval(() => {
            if (currentIdx < recordedFrames.length && isPlay) {
                render(recordedFrames[currentIdx].pos, recordedFrames[currentIdx].sc);
                document.getElementById('timeline').value = currentIdx;
                currentIdx++;
            } else { clearInterval(interval); isPlay = false; document.getElementById('play-btn').innerText = "▶ ПУСК"; }
        }, 40);
    }

    function seek(v) { currentIdx = parseInt(v); render(recordedFrames[currentIdx].pos, recordedFrames[currentIdx].sc); }

    function saveData() {
        if (recordedFrames.length === 0) return tg.showAlert("Запишите движение!");
        const data = JSON.stringify({ frames: recordedFrames });
        tg.sendData(data); // Отправка в бот
    }

    window.onload = () => {
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        const hash = window.location.hash;
        if (hash.includes('data=')) {
            const d = JSON.parse(decodeURIComponent(hash.split('data=')[1]));
            recordedFrames = d.frames;
            document.getElementById('player-controls').style.display = "flex";
            document.getElementById('rec-btn').style.display = "none";
            render(recordedFrames[0].pos, recordedFrames[0].sc);
        } else { render(players); }
    };
</script>
</body>
</html>
