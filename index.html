<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #canvas-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        canvas { 
            display: block; 
            flex-grow: 1; 
            /* Используем твой файл из репозитория */
            background-image: url('basketbolnaya-ploshchadka.jpg'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
        }
        #controls { 
            height: 80px; 
            background: #111; 
            display: flex; 
            align-items: center; 
            justify-content: space-around; 
            border-top: 1px solid #333; 
        }
        button { 
            padding: 12px 20px; border-radius: 8px; border: none; 
            color: white; font-weight: bold; font-size: 14px; cursor: pointer;
            text-transform: uppercase;
        }
        .btn-record { background: #e74c3c; box-shadow: 0 4px 0 #c0392b; }
        .btn-record.active { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; }
        .btn-save { background: #f39c12; box-shadow: 0 4px 0 #d35400; }
        button:active { transform: translateY(2px); box-shadow: none; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="court"></canvas>
        <div id="controls">
            <button id="recBtn" class="btn-record" onclick="toggleRecord()">⏺ ЗАПИСЬ</button>
            <button class="btn-save" onclick="sendData()">💾 СОХРАНИТЬ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('court');
        const ctx = canvas.getContext('2d');
        
        let isRecording = false;
        let animationData = [];
        
        let players = [
            { id: 1, x: 0.5, y: 0.8, label: '1', pos: 'PG' },
            { id: 2, x: 0.3, y: 0.6, label: '2', pos: 'SG' },
            { id: 3, x: 0.7, y: 0.6, label: '3', pos: 'SF' },
            { id: 4, x: 0.35, y: 0.4, label: '4', pos: 'PF' },
            { id: 5, x: 0.65, y: 0.4, label: '5', pos: 'C' }
        ];

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            players.forEach(p => {
                const px = p.x * canvas.width;
                const py = p.y * canvas.height;
                
                // Тень для объема
                ctx.shadowBlur = 8;
                ctx.shadowColor = "rgba(0,0,0,0.6)";
                
                ctx.beginPath();
                ctx.arc(px, py, 20, 0, Math.PI*2);
                ctx.fillStyle = "#e74c3c";
                ctx.fill();
                
                // Белая обводка
                ctx.strokeStyle = "white";
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = "white";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "center";
                ctx.fillText(p.label, px, py + 6);
            });
        }

        function toggleRecord() {
            isRecording = !isRecording;
            const btn = document.getElementById('recBtn');
            btn.innerText = isRecording ? "⏹ СТОП" : "⏺ ЗАПИСЬ";
            btn.classList.toggle('active');
            if (isRecording) animationData = [];
        }

        function recordFrame() {
            if (isRecording) {
                animationData.push(players.map(p => ({ x: p.x.toFixed(3), y: p.y.toFixed(3) })));
            }
        }
        setInterval(recordFrame, 100);

        let selectedPlayer = null;
        function getCoords(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = canvas.getBoundingClientRect();
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        const startHandler = e => {
            const c = getCoords(e);
            selectedPlayer = players.find(p => Math.hypot(p.x * canvas.width - c.x, p.y * canvas.height - c.y) < 30);
        };
        const moveHandler = e => {
            if (selectedPlayer) {
                const c = getCoords(e);
                selectedPlayer.x = c.x / canvas.width;
                selectedPlayer.y = c.y / canvas.height;
                draw();
            }
        };

        canvas.addEventListener('mousedown', startHandler);
        canvas.addEventListener('mousemove', moveHandler);
        window.addEventListener('mouseup', () => selectedPlayer = null);
        canvas.addEventListener('touchstart', startHandler);
        canvas.addEventListener('touchmove', moveHandler);
        window.addEventListener('touchend', () => selectedPlayer = null);

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 80;
            draw();
        }
        window.addEventListener('resize', resize);
        
        function sendData() {
            tg.sendData(JSON.stringify({ animation: animationData, final: players }));
            tg.close();
        }
        resize();
    </script>
</body>
</html>
