<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Legion Tactical Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; touch-action: none; color: white; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        
        /* Поле */
        #court-wrapper { 
            flex-grow: 1; position: relative;
            background-image: url('basketbolnaya-ploshchadka.jpg');
            background-size: contain; background-repeat: no-repeat; background-position: center;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Панель управления плеером */
        #player-controls { 
            background: #222; padding: 10px; display: flex; flex-direction: column; gap: 10px;
            border-top: 1px solid #444;
        }
        .row { display: flex; justify-content: space-around; align-items: center; }
        
        input[type=range] { flex-grow: 1; margin: 0 15px; }
        
        .btn { padding: 8px 15px; border-radius: 5px; border: none; background: #444; color: white; font-weight: bold; }
        .btn.active { background: #ff6b00; }
        .speed-btn { width: 40px; font-size: 12px; }

        #main-nav { height: 60px; background: #111; display: flex; justify-content: space-around; align-items: center; }
        .save-btn { background: #2ecc71; padding: 10px 30px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="court-wrapper"><canvas id="court"></canvas></div>
        
        <div id="player-controls">
            <div class="row">
                <span id="current-time">00:00</span>
                <input type="range" id="timeline" min="0" value="0" step="1">
                <span id="total-time">00:00</span>
            </div>
            <div class="row">
                <button class="btn" onclick="togglePlay()" id="play-btn">▶ PLAY</button>
                <button class="btn speed-btn" onclick="setSpeed(0.5)">0.5x</button>
                <button class="btn speed-btn active" id="sp1" onclick="setSpeed(1)">1x</button>
                <button class="btn speed-btn" onclick="setSpeed(2)">2x</button>
                <button class="btn" onclick="resetPositions()">⏪ СБРОС</button>
            </div>
        </div>

        <div id="main-nav">
            <button class="btn" onclick="startRecording()" id="rec-btn">⏺ ЗАПИСЬ</button>
            <button class="btn save-btn" onclick="saveScheme()">СОХРАНИТЬ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const canvas = document.getElementById('court');
        const ctx = canvas.getContext('2d');
        
        let players = [
            { id: 1, x: 0.5, y: 0.8, label: '1' },
            { id: 2, x: 0.3, y: 0.7, label: '2' },
            { id: 3, x: 0.7, y: 0.7, label: '3' },
            { id: 4, x: 0.2, y: 0.4, label: '4' },
            { id: 5, x: 0.8, y: 0.4, label: '5' }
        ];

        let recordedFrames = []; // Массив состояний всех игроков
        let isRecording = false;
        let isPlaying = false;
        let currentFrameIdx = 0;
        let playbackSpeed = 1;
        let playInterval;

        // Рисование
        function draw(positions) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            positions.forEach(p => {
                const px = p.x * canvas.width;
                const py = p.y * canvas.height;
                ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI*2);
                ctx.fillStyle = "#ff6b00"; ctx.fill();
                ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = "white"; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
                ctx.fillText(p.label, px, py + 6);
            });
        }

        // Запись
        function startRecording() {
            isRecording = !isRecording;
            const btn = document.getElementById('rec-btn');
            if (isRecording) {
                recordedFrames = [];
                btn.innerText = "⏹ СТОП";
                btn.style.background = "#e74c3c";
            } else {
                btn.innerText = "⏺ ЗАПИСЬ";
                btn.style.background = "#444";
                initPlayer();
            }
        }

        // Логика записи (50 кадров в секунду для плавности)
        setInterval(() => {
            if (isRecording) {
                recordedFrames.push(players.map(p => ({x: p.x, y: p.y, label: p.label})));
            }
        }, 20);

        // Плеер
        function initPlayer() {
            const slider = document.getElementById('timeline');
            slider.max = recordedFrames.length - 1;
            document.getElementById('total-time').innerText = (recordedFrames.length / 50).toFixed(1) + "s";
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('play-btn');
            btn.innerText = isPlaying ? "⏸ PAUSE" : "▶ PLAY";
            if (isPlaying) play(); else clearInterval(playInterval);
        }

        function play() {
            clearInterval(playInterval);
            playInterval = setInterval(() => {
                if (currentFrameIdx < recordedFrames.length) {
                    draw(recordedFrames[currentFrameIdx]);
                    document.getElementById('timeline').value = currentFrameIdx;
                    document.getElementById('current-time').innerText = (currentFrameIdx / 50).toFixed(1) + "s";
                    currentFrameIdx++;
                } else {
                    togglePlay();
                    currentFrameIdx = 0;
                }
            }, 20 / playbackSpeed);
        }

        function setSpeed(s) {
            playbackSpeed = s;
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
            if (isPlaying) play(); 
        }

        // Drag & Drop
        let selected = null;
        canvas.addEventListener('touchstart', e => {
            if (isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches[0].clientX - rect.left) / canvas.width;
            const y = (e.touches[0].clientY - rect.top) / canvas.height;
            selected = players.find(p => Math.hypot(p.x - x, p.y - y) < 0.08);
        });

        canvas.addEventListener('touchmove', e => {
            if (selected && !isPlaying) {
                const rect = canvas.getBoundingClientRect();
                selected.x = (e.touches[0].clientX - rect.left) / canvas.width;
                selected.y = (e.touches[0].clientY - rect.top) / canvas.height;
                draw(players);
            }
        });

        function saveScheme() {
            tg.sendData(JSON.stringify({
                frames: recordedFrames,
                duration: recordedFrames.length
            }));
            tg.close();
        }

        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            draw(recordedFrames[currentFrameIdx] || players);
        });
        window.dispatchEvent(new Event('resize'));
    </script>
</body>
</html>
