<!DOCTYPE html>
<html style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Legion Tactics - Solo Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; position: fixed; font-family: sans-serif; }
        #app { display: flex; flex-direction: column; height: 100%; width: 100%; }
        #court-wrapper { position: relative; flex: 1; background-image: url('basketbolnaya-ploshchadka.jpg'); background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #002d20; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; }
        
        #toolbar { background: #1a1a1a; display: flex; justify-content: space-around; padding: 12px 10px; border-bottom: 1px solid #333; }
        .tool-btn { padding: 8px 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 11px; font-weight: bold; }
        .tool-btn.active { border-color: #ff6b00; background: #333; color: #ff6b00; box-shadow: 0 0 10px rgba(255,107,0,0.2); }
        
        #controls-area { background: #111; padding-bottom: env(safe-area-inset-bottom); z-index: 100; border-top: 1px solid #333; }
        #player-controls { display: none; flex-direction: column; gap: 10px; padding: 15px; }
        
        .row { display: flex; justify-content: space-around; align-items: center; color: white; }
        input[type=range] { flex: 1; margin: 0 15px; accent-color: #ff6b00; height: 6px; }
        
        #main-nav { height: 80px; display: flex; justify-content: space-around; align-items: center; padding: 0 10px; }
        .btn { padding: 12px 20px; border-radius: 12px; border: none; background: #333; color: white; font-weight: bold; transition: 0.2s; }
        .btn-orange { background: #ff6b00; color: black; }
        .btn-clear { border: 1px solid #e74c3c; color: #e74c3c; background: transparent; }
    </style>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <button class="tool-btn active" id="t-move" onclick="setTool('move')">🏃 Траектория</button>
            <button class="tool-btn" id="t-ball" onclick="setTool('ball')">🏀 Пас</button>
            <button class="tool-btn" id="t-screen" onclick="setTool('screen')">┳ Заслон</button>
            <button class="btn-clear btn" style="padding: 8px 12px; font-size: 11px;" onclick="clearArrows()">🧹 Сброс схем</button>
        </div>
        
        <div id="court-wrapper"><canvas id="court"></canvas></div>
        
        <div id="controls-area">
            <div id="player-controls">
                <div class="row">
                    <span id="time-display" style="font-size: 12px; font-family: monospace;">0.0s</span>
                    <input type="range" id="timeline" value="0" oninput="seek(this.value)">
                </div>
                <div class="row">
                    <button class="btn btn-orange" id="play-btn" onclick="togglePlay()">▶ СМОТРЕТЬ</button>
                    <button class="btn" onclick="undo()">↩ ШАГ НАЗАД</button>
                </div>
            </div>
            <div id="main-nav">
                <button class="btn" id="rec-btn" onclick="toggleRec()">⏺ ЗАПИСЬ КОМБИНАЦИИ</button>
                <button class="btn btn-orange" onclick="saveData()">💾 ОТПРАВИТЬ</button>
            </div>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    const canvas = document.getElementById('court');
    const ctx = canvas.getContext('2d');
    
    let tool = 'move';
    let players = [
        { id: 1, x: 0.5, y: 0.85, label: '1', path: [] }, 
        { id: 2, x: 0.15, y: 0.65, label: '2', path: [] },
        { id: 3, x: 0.85, y: 0.65, label: '3', path: [] }, 
        { id: 4, x: 0.3, y: 0.35, label: '4', path: [] },
        { id: 5, x: 0.7, y: 0.35, label: '5', path: [] }
    ];
    
    let ball = { x: 0.5, y: 0.85, targetId: 1, isFlying: false };
    let ballTrail = []; 
    let screens = []; 
    let history = []; 
    let recordedFrames = [];
    let isRec = false; let isPlay = false; let currentIdx = 0; let activeTouches = {}; 

    function triggerHaptic(s) { try { tg.HapticFeedback.impactOccurred(s); } catch(e) {} }

    function animate() {
        if (ball.isFlying) {
            const target = players.find(p => p.id === ball.targetId);
            const dx = target.x - ball.x; const dy = target.y - ball.y;
            if (Math.hypot(dx, dy) < 0.02) { ball.x = target.x; ball.y = target.y; ball.isFlying = false; triggerHaptic('light'); }
            else { ball.x += dx * 0.2; ball.y += dy * 0.2; }
        } else {
            const p = players.find(pl => pl.id === ball.targetId);
            ball.x = p.x; ball.y = p.y;
        }
        
        // Хвост мяча
        ballTrail.push({x: ball.x, y: ball.y});
        if (ballTrail.length > 8) ballTrail.shift();

        render();
        requestAnimationFrame(animate);
    }

    function drawArrowHead(ctx, x, y, angle) {
        const size = 12;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - size * Math.cos(angle - Math.PI / 6), y - size * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(x, y);
        ctx.lineTo(x - size * Math.cos(angle + Math.PI / 6), y - size * Math.sin(angle + Math.PI / 6));
        ctx.stroke();
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. Линии траекторий
        players.forEach(p => {
            if (p.path.length < 2) return;
            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx.lineWidth = 3; ctx.lineJoin = "round";
            ctx.beginPath();
            ctx.moveTo(p.path[0].x * canvas.width, p.path[0].y * canvas.height);
            for(let pt of p.path) ctx.lineTo(pt.x * canvas.width, pt.y * canvas.height);
            ctx.stroke();
            
            // Наконечник
            const p1 = p.path[p.path.length - 2];
            const p2 = p.path[p.path.length - 1];
            const angle = Math.atan2((p2.y - p1.y)*canvas.height, (p2.x - p1.x)*canvas.width);
            drawArrowHead(ctx, p2.x * canvas.width, p2.y * canvas.height, angle);
            ctx.restore();
        });

        // 2. Хвост мяча (при пасе)
        if (ball.isFlying) {
            ballTrail.forEach((t, i) => {
                ctx.beginPath(); ctx.arc(t.x * canvas.width + 12, t.y * canvas.height - 12, i * 1.2, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 107, 0, ${i/10})`; ctx.fill();
            });
        }

        // 3. Заслоны
        screens.forEach(s => {
            const sx = s.x * canvas.width; const sy = s.y * canvas.height;
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(sx, sy-15); ctx.lineTo(sx, sy+15); ctx.stroke();
        });

        // 4. Игроки
        players.forEach(p => {
            const px = p.x * canvas.width; const py = p.y * canvas.height;
            ctx.beginPath(); ctx.arc(px, py, 22, 0, Math.PI*2);
            ctx.fillStyle = "#bdc3c7"; ctx.fill();
            ctx.strokeStyle = Object.values(activeTouches).some(t => t.target === p) ? "#ff6b00" : "#000";
            ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#000"; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
            ctx.fillText(p.label, px, py + 6);
        });

        // 5. Мяч
        ctx.beginPath();
        ctx.arc(ball.x * canvas.width + 15, ball.y * canvas.height - 15, 9, 0, Math.PI*2);
        ctx.fillStyle = "#ff6b00"; ctx.fill();
        ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();
    }

    canvas.addEventListener('touchstart', (e) => {
        if (isPlay) return;
        saveState();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const r = canvas.getBoundingClientRect();
            const p = { x: (touch.clientX - r.left) / canvas.width, y: (touch.clientY - r.top) / canvas.height };
            
            if (tool === 'ball') {
                const hit = players.find(pl => Math.hypot(pl.x - p.x, pl.y - p.y) < 0.1);
                if (hit && hit.id !== ball.targetId) { ball.targetId = hit.id; ball.isFlying = true; triggerHaptic('medium'); }
            } else if (tool === 'screen') {
                const hitIdx = screens.findIndex(s => Math.hypot(s.x - p.x, s.y - p.y) < 0.08);
                if (hitIdx !== -1) activeTouches[touch.identifier] = { target: screens[hitIdx], type: 'screen', index: hitIdx };
                else { let n = {x: p.x, y: p.y}; screens.push(n); activeTouches[touch.identifier] = { target: n, type: 'screen', index: screens.length - 1 }; triggerHaptic('light'); }
            } else {
                const hit = players.find(pl => Math.hypot(pl.x - p.x, pl.y - p.y) < 0.1);
                if (hit) { hit.path = [{x: hit.x, y: hit.y}]; activeTouches[touch.identifier] = { target: hit, type: 'player' }; }
            }
        }
        e.preventDefault();
    }, {passive: false});

    canvas.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const state = activeTouches[touch.identifier];
            if (state) {
                const r = canvas.getBoundingClientRect();
                const nx = (touch.clientX - r.left) / canvas.width;
                const ny = (touch.clientY - r.top) / canvas.height;
                if (state.type === 'player') state.target.path.push({x: nx, y: ny});
                if (state.type === 'screen' && (nx<0.02 || nx>0.98 || ny<0.02 || ny>0.98)) {
                    screens.splice(state.index, 1); delete activeTouches[touch.identifier]; triggerHaptic('medium'); continue;
                }
                state.target.x = nx; state.target.y = ny;
            }
        }
    });

    canvas.addEventListener('touchend', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) delete activeTouches[e.changedTouches[i].identifier];
    });

    function clearArrows() { triggerHaptic('medium'); players.forEach(p => p.path = []); }
    function setTool(t) { tool = t; triggerHaptic('light'); document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); document.getElementById('t-' + t).classList.add('active'); }
    function saveState() { history.push(JSON.stringify({ players, screens, ball })); if (history.length > 20) history.shift(); }
    function undo() { if (history.length === 0) return; const last = JSON.parse(history.pop()); players = last.players; screens = last.screens; ball = last.ball; triggerHaptic('light'); }

    function toggleRec() {
        isRec = !isRec;
        const btn = document.getElementById('rec-btn');
        btn.innerText = isRec ? "⏹ ОСТАНОВИТЬ ЗАПИСЬ" : "⏺ ЗАПИСЬ КОМБИНАЦИИ";
        btn.style.background = isRec ? "#e74c3c" : "#333";
        if (!isRec && recordedFrames.length > 0) {
            document.getElementById('player-controls').style.display = "flex";
            document.getElementById('timeline').max = recordedFrames.length - 1;
        }
    }

    setInterval(() => { 
        if(isRec) {
            recordedFrames.push({ pos: JSON.parse(JSON.stringify(players)), scs: JSON.parse(JSON.stringify(screens)), ball: JSON.parse(JSON.stringify(ball)) }); 
        }
    }, 40);

    function togglePlay() {
        isPlay = !isPlay;
        if (isPlay) {
            const anim = setInterval(() => {
                if (currentIdx < recordedFrames.length && isPlay) {
                    const f = recordedFrames[currentIdx];
                    players = f.pos; screens = f.scs; ball = f.ball;
                    document.getElementById('timeline').value = currentIdx;
                    document.getElementById('time-display').innerText = (currentIdx * 0.04).toFixed(1) + "s";
                    currentIdx++;
                } else { clearInterval(anim); isPlay = false; if(currentIdx >= recordedFrames.length) currentIdx = 0; }
            }, 40);
        }
    }

    function seek(v) { currentIdx = parseInt(v); const f = recordedFrames[currentIdx]; if(f) { players = f.pos; screens = f.scs; ball = f.ball; } }
    
    function saveData() {
        if (recordedFrames.length === 0) return tg.showAlert("Запишите движение!");
        tg.sendData(JSON.stringify({ frames: recordedFrames }));
    }

    window.onload = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; animate(); };
</script>
</body>
</html>
