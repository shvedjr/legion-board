<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Legion Pro Board</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #canvas-container { display: flex; flex-direction: column; height: 100vh; }
        
        /* Площадка */
        #court-wrapper { 
            flex-grow: 1; position: relative;
            background-image: url('basketbolnaya-ploshchadka.jpg');
            background-size: contain; background-repeat: no-repeat; background-position: center;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Панель инструментов */
        #toolbar { 
            background: #222; display: flex; justify-content: space-around; padding: 10px;
            border-bottom: 1px solid #444;
        }
        .tool { 
            width: 45px; height: 45px; border-radius: 5px; border: 2px solid #555;
            background: #333; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .tool.active { border-color: #ff6b00; background: #444; }

        #controls { 
            height: 70px; background: #1a1a1a; display: flex; 
            align-items: center; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom);
        }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; color: white; font-weight: bold; }
        .btn-save { background: #3498db; }
        .btn-clear { background: #555; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="toolbar">
            <div class="tool active" onclick="setTool('move')" id="tool-move">🖐️</div>
            <div class="tool" onclick="setTool('pass')" id="tool-pass">--🏀</div> <div class="tool" onclick="setTool('run')" id="tool-run">➡️</div> <div class="tool" onclick="setTool('screen')" id="tool-screen">┳</div> </div>
        <div id="court-wrapper"><canvas id="court"></canvas></div>
        <div id="controls">
            <button class="btn btn-clear" onclick="clearBoard()">ОЧИСТИТЬ</button>
            <button class="btn btn-save" onclick="sendData()">СОХРАНИТЬ СХЕМУ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const canvas = document.getElementById('court');
        const ctx = canvas.getContext('2d');
        let tool = 'move';
        let drawings = []; // Здесь храним все стрелки и заслоны
        let players = [
            { id: 1, x: 0.5, y: 0.8, label: '1', ball: true },
            { id: 2, x: 0.3, y: 0.7, label: '2' },
            { id: 3, x: 0.7, y: 0.7, label: '3' },
            { id: 4, x: 0.2, y: 0.4, label: '4' },
            { id: 5, x: 0.8, y: 0.4, label: '5' }
        ];

        function setTool(t) {
            tool = t;
            document.querySelectorAll('.tool').forEach(el => el.classList.remove('active'));
            document.getElementById('tool-' + t).classList.add('active');
        }

        function drawArrow(start, end, type) {
            ctx.beginPath();
            ctx.moveTo(start.x * canvas.width, start.y * canvas.height);
            ctx.lineTo(end.x * canvas.width, end.y * canvas.height);
            
            if (type === 'pass') ctx.setLineDash([10, 10]); // Пунктир для паса
            else ctx.setLineDash([]);
            
            ctx.strokeStyle = type === 'screen' ? '#f1c40f' : 'white';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Рисуем наконечник или планку заслона
            const angle = Math.atan2((end.y - start.y) * canvas.height, (end.x - start.x) * canvas.width);
            ctx.setLineDash([]);
            if (type === 'screen') {
                // Планка заслона (Т-образная)
                ctx.save();
                ctx.translate(end.x * canvas.width, end.y * canvas.height);
                ctx.rotate(angle);
                ctx.moveTo(0, -15); ctx.lineTo(0, 15); ctx.stroke();
                ctx.restore();
            } else {
                // Стрелка
                ctx.save();
                ctx.translate(end.x * canvas.width, end.y * canvas.height);
                ctx.rotate(angle);
                ctx.moveTo(0, 0); ctx.lineTo(-15, -10); ctx.moveTo(0, 0); ctx.lineTo(-15, 10);
                ctx.stroke();
                ctx.restore();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Рисуем все стрелки
            drawings.forEach(d => drawArrow(d.start, d.end, d.type));

            // 2. Рисуем игроков
            players.forEach(p => {
                const px = p.x * canvas.width; const py = p.y * canvas.height;
                ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI*2);
                ctx.fillStyle = "#ff6b00"; ctx.fill();
                ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = "white"; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
                ctx.fillText(p.label, px, py + 6);
                if (p.ball) { // Мяч у игрока
                    ctx.beginPath(); ctx.arc(px + 15, py - 15, 8, 0, Math.PI*2);
                    ctx.fillStyle = "#f39c12"; ctx.fill(); ctx.stroke();
                }
            });
        }

        let isDrawing = false;
        let startPoint = null;
        let selectedPlayer = null;

        canvas.addEventListener('touchstart', e => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = (touch.clientX - rect.left) / canvas.width;
            const y = (touch.clientY - rect.top) / canvas.height;
            
            startPoint = {x, y};
            selectedPlayer = players.find(p => Math.hypot(p.x - x, p.y - y) < 0.08);

            if (tool !== 'move') isDrawing = true;
        });

        canvas.addEventListener('touchmove', e => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = (touch.clientX - rect.left) / canvas.width;
            const y = (touch.clientY - rect.top) / canvas.height;

            if (tool === 'move' && selectedPlayer) {
                selectedPlayer.x = x; selectedPlayer.y = y;
            }
            draw();
            if (isDrawing) drawArrow(startPoint, {x, y}, tool);
        });

        canvas.addEventListener('touchend', e => {
            if (isDrawing) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.changedTouches[0];
                const x = (touch.clientX - rect.left) / canvas.width;
                const y = (touch.clientY - rect.top) / canvas.height;
                drawings.push({start: startPoint, end: {x, y}, type: tool});
            }
            isDrawing = false; selectedPlayer = null;
            draw();
        });

        function clearBoard() { drawings = []; draw(); }

        function sendData() {
            tg.sendData(JSON.stringify({drawings, players}));
            tg.close();
        }

        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; draw();
        });
        window.dispatchEvent(new Event('resize'));
    </script>
</body>
</html>
