<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Legion Pro Board</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; touch-action: none; color: white; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        #court-wrapper { 
            flex-grow: 1; position: relative;
            background-image: url('basketbolnaya-ploshchadka.jpg');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            background-color: #002d20;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; touch-action: none; }
        #player-controls { 
            background: #1a1a1a; padding: 15px; display: flex; flex-direction: column; gap: 10px;
            border-top: 1px solid #333; display: none; 
        }
        .row { display: flex; justify-content: space-around; align-items: center; }
        input[type=range] { flex-grow: 1; margin: 0 15px; accent-color: #ff6b00; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; background: #333; color: white; font-weight: bold; font-size: 14px; }
        .btn-orange { background: #ff6b00; }
        #main-nav { 
            height: 80px; background: #111; display: flex; justify-content: space-around; 
            align-items: center; padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="court-wrapper"><canvas id="court"></canvas></div>
        <div id="player-controls">
            <div class="row">
                <span id="current-time">0.0s</span>
                <input type="range" id="timeline" min="0" value="0" step="1">
                <span id="total-time">0.0s</span>
            </div>
            <div class="row">
                <button class="btn btn-orange" id="play-btn">▶ PLAY</button>
                <button class="btn" id="reset-btn">⏪ СБРОС</button>
            </div>
        </div>
        <div id="main-nav">
            <button class="btn" id="rec-btn">⏺ ЗАПИСЬ</button>
            <button class="btn btn-orange" id="save-btn">💾 СОХРАНИТЬ</button>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('court');
    const ctx = canvas.getContext('2d');
    
    let players = [
        { id: 1, x: 0.5, y: 0.85, label: '1' },
        { id: 2, x: 0.2, y: 0.75, label: '2' },
        { id: 3, x: 0.8, y: 0.75, label: '3' },
        { id: 4, x: 0.3, y: 0.55, label: '4' },
        { id: 5, x: 0.7, y: 0.55, label: '5' }
    ];

    let recordedFrames = [];
    let isRecording = false;
    let isPlaying = false;
    let currentFrameIdx = 0;
    let selectedPlayer = null;

    // --- ОТРИСОВКА ---
    function render(positions) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        positions.forEach(p => {
            const px = p.x * canvas.width;
            const py = p.y * canvas.height;
            ctx.beginPath(); ctx.arc(px, py, 22, 0, Math.PI*2);
            ctx.fillStyle = "#ff6b00"; ctx.fill();
            ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "white"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center";
            ctx.fillText(p.label, px, py + 7);
        });
    }

    // --- УПРАВЛЕНИЕ (POINTER EVENTS) ---
    const getPoint = (e) => {
        const rect = canvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) / canvas.width, y: (e.clientY - rect.top) / canvas.height };
    };

    canvas.onpointerdown = (e) => {
        if (isPlaying) return;
        const p = getPoint(e);
        selectedPlayer = players.find(pl => Math.hypot(pl.x - p.x, pl.y - p.y) < 0.08);
        if (selectedPlayer) {
            canvas.setPointerCapture(e.pointerId);
            tg.HapticFeedback.impactOccurred('light');
        }
    };

    canvas.onpointermove = (e) => {
        if (!selectedPlayer || isPlaying) return;
        const p = getPoint(e);
        selectedPlayer.x = Math.max(0, Math.min(1, p.x));
        selectedPlayer.y = Math.max(0, Math.min(1, p.y));
        render(players);
    };

    canvas.onpointerup = (e) => {
        if (selectedPlayer) {
            canvas.releasePointerCapture(e.pointerId);
            selectedPlayer = null;
        }
    };

    // --- ЗАПИСЬ ---
    document.getElementById('rec-btn').onclick = function() {
        isRecording = !isRecording;
        if (isRecording) {
            recordedFrames = [];
            this.innerText = "⏹ СТОП";
            this.style.background = "#e74c3c";
            document.getElementById('player-controls').style.display = "none";
        } else {
            this.innerText = "⏺ ЗАПИСЬ";
            this.style.background = "#333";
            if (recordedFrames.length > 0) {
                document.getElementById('player-controls').style.display = "flex";
                setupTimeline();
            }
        }
    };

    setInterval(() => {
        if (isRecording) {
            recordedFrames.push(players.map(p => ({...p})));
        }
    }, 40);

    // --- ПЛЕЕР ---
    function setupTimeline() {
        const slider = document.getElementById('timeline');
        slider.max = recordedFrames.length - 1;
        document.getElementById('total-time').innerText = (recordedFrames.length * 0.04).toFixed(1) + "s";
    }

    document.getElementById('play-btn').onclick = function() {
        if (recordedFrames.length === 0) return;
        isPlaying = !isPlaying;
        this.innerText = isPlaying ? "⏸ PAUSE" : "▶ PLAY";
        if (isPlaying) {
            const interval = setInterval(() => {
                if (currentFrameIdx < recordedFrames.length && isPlaying) {
                    render(recordedFrames[currentFrameIdx]);
                    document.getElementById('timeline').value = currentFrameIdx;
                    document.getElementById('current-time').innerText = (currentFrameIdx * 0.04).toFixed(1) + "s";
                    currentFrameIdx++;
                } else {
                    clearInterval(interval);
                    isPlaying = false;
                    this.innerText = "▶ PLAY";
                    if (currentFrameIdx >= recordedFrames.length) currentFrameIdx = 0;
                }
            }, 40);
        }
    };

    document.getElementById('reset-btn').onclick = () => {
        currentFrameIdx = 0;
        isPlaying = false;
        document.getElementById('play-btn').innerText = "▶ PLAY";
        render(recordedFrames[0] || players);
    };

    document.getElementById('timeline').oninput = function() {
        currentFrameIdx = parseInt(this.value);
        render(recordedFrames[currentFrameIdx]);
        document.getElementById('current-time').innerText = (currentFrameIdx * 0.04).toFixed(1) + "s";
    };

    document.getElementById('save-btn').onclick = () => {
        if (recordedFrames.length === 0) return tg.showAlert("Запишите движение!");
        tg.sendData(JSON.stringify({ frames: recordedFrames }));
        tg.close();
    };

    window.onresize = () => {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        render(players);
    };

    // Загрузка из архива
    window.onload = () => {
        window.onresize();
        const hash = window.location.hash;
        if (hash.includes('data=')) {
            const data = JSON.parse(decodeURIComponent(hash.split('data=')[1]));
            recordedFrames = data.frames;
            document.getElementById('player-controls').style.display = "flex";
            document.getElementById('rec-btn').style.display = "none";
            setupTimeline();
            render(recordedFrames[0]);
        }
    };
</script>
</body>
</html>
