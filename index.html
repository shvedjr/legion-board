<!DOCTYPE html>
<html style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Legion Tactics Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; position: fixed; font-family: sans-serif; }
        #app { display: flex; flex-direction: column; height: 100%; width: 100%; }
        #court-wrapper { position: relative; flex: 1; background-image: url('basketbolnaya-ploshchadka.jpg'); background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #002d20; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; }
        #toolbar { background: #1a1a1a; display: flex; justify-content: space-around; padding: 10px; border-bottom: 1px solid #333; }
        .tool-btn { padding: 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 13px; font-weight: bold; }
        .tool-btn.active { border-color: #ff6b00; background: #333; color: #ff6b00; }
        #controls-area { background: #111; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        #player-controls { display: none; flex-direction: column; gap: 8px; padding: 12px; border-top: 1px solid #333; }
        .row { display: flex; justify-content: space-around; align-items: center; color: white; font-size: 14px; }
        input[type=range] { flex: 1; margin: 0 15px; accent-color: #ff6b00; }
        #main-nav { height: 75px; display: flex; justify-content: space-around; align-items: center; }
        .btn { padding: 12px 20px; border-radius: 10px; border: none; background: #333; color: white; font-weight: bold; }
        .btn-orange { background: #ff6b00; color: black; }
    </style>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <button class="tool-btn active" id="t-move" onclick="setTool('move')">🏃 ИГРОКИ</button>
            <button class="tool-btn" id="t-ball" onclick="setTool('ball')">🏀 МЯЧ</button>
            <button class="tool-btn" id="t-screen" onclick="setTool('screen')">┳ ЗАСЛОН</button>
            <button class="tool-btn" style="color:#e74c3c" onclick="undo()">↩ НАЗАД</button>
        </div>
        <div id="court-wrapper"><canvas id="court"></canvas></div>
        <div id="controls-area">
            <div id="player-controls">
                <div class="row">
                    <span id="curr">0.0s</span>
                    <input type="range" id="timeline" value="0" oninput="seek(this.value)">
                    <span id="total">0.0s</span>
                </div>
                <div class="row">
                    <button class="btn btn-orange" id="play-btn" onclick="togglePlay()">▶ ПУСК</button>
                    <button class="btn" onclick="location.reload()">🔄 СБРОС</button>
                </div>
            </div>
            <div id="main-nav">
                <button class="btn" id="rec-btn" onclick="toggleRec()">⏺ ЗАПИСЬ</button>
                <button class="btn btn-orange" onclick="saveData()">💾 СОХРАНИТЬ</button>
            </div>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Расширяем на весь экран сразу

    const canvas = document.getElementById('court');
    const ctx = canvas.getContext('2d');
    
    // Продвинутая функция вибрации
    function triggerHaptic(style = 'medium') {
        if (!tg.HapticFeedback) return;
        
        switch(style) {
            case 'light': tg.HapticFeedback.impactOccurred('light'); break;
            case 'medium': tg.HapticFeedback.impactOccurred('medium'); break;
            case 'heavy': tg.HapticFeedback.impactOccurred('heavy'); break;
            case 'success': tg.HapticFeedback.notificationOccurred('success'); break;
            case 'warning': tg.HapticFeedback.notificationOccurred('warning'); break;
        }
        
        // Дублируем стандартным API для Android
        if (navigator.vibrate) {
            if (style === 'medium') navigator.vibrate(40);
            if (style === 'success') navigator.vibrate([30, 50, 30]);
        }
    }

    let tool = 'move';
    let players = [
        { id: 1, x: 0.5, y: 0.8, label: '1' }, { id: 2, x: 0.3, y: 0.7, label: '2' },
        { id: 3, x: 0.7, y: 0.7, label: '3' }, { id: 4, x: 0.2, y: 0.4, label: '4' },
        { id: 5, x: 0.8, y: 0.4, label: '5' }
    ];
    let ballId = 1;
    let screens = [];
    let history = [];
    let recordedFrames = [];
    let isRec = false; let isPlay = false; let currentIdx = 0;
    let activeTouches = {}; 

    function saveState() {
        history.push(JSON.stringify({ players, screens, ballId }));
        if (history.length > 30) history.shift();
    }

    function undo() {
        if (history.length === 0) return;
        triggerHaptic('light');
        const last = JSON.parse(history.pop());
        players = last.players; screens = last.screens; ballId = last.ballId;
        render(players, screens, ballId);
    }

    function setTool(t) {
        triggerHaptic('light');
        tool = t;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('t-' + t).classList.add('active');
    }

    function render(pos, scs, bId) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        scs.forEach(s => {
            const sx = s.x * canvas.width; const sy = s.y * canvas.height;
            ctx.beginPath(); ctx.moveTo(sx, sy - 18); ctx.lineTo(sx, sy + 18);
            ctx.strokeStyle = "#000"; ctx.lineWidth = 6; ctx.stroke();
        });
        pos.forEach(p => {
            const px = p.x * canvas.width; const py = p.y * canvas.height;
            ctx.beginPath(); ctx.arc(px, py, 22, 0, Math.PI*2);
            ctx.fillStyle = "#bdc3c7"; ctx.fill();
            let isMoving = Object.values(activeTouches).some(t => t.target === p);
            ctx.strokeStyle = isMoving ? "#ff6b00" : "#000"; 
            ctx.lineWidth = isMoving ? 5 : 3; 
            ctx.stroke();
            ctx.fillStyle = "#000"; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
            ctx.fillText(p.label, px, py + 6);
            if (p.id === bId) {
                ctx.beginPath(); ctx.arc(px + 16, py - 16, 8, 0, Math.PI*2);
                ctx.fillStyle = "#e67e22"; ctx.fill(); ctx.stroke();
            }
        });
    }

    canvas.addEventListener('touchstart', (e) => {
        if (isPlay) return;
        saveState();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const r = canvas.getBoundingClientRect();
            const p = { x: (touch.clientX - r.left) / canvas.width, y: (touch.clientY - r.top) / canvas.height };
            
            if (tool === 'ball') {
                const hit = players.find(pl => Math.hypot(pl.x - p.x, pl.y - p.y) < 0.1);
                if (hit) { 
                    ballId = hit.id; 
                    triggerHaptic('success');
                }
            } else if (tool === 'screen') {
                const hit = screens.find(s => Math.hypot(s.x - p.x, s.y - p.y) < 0.08);
                if (hit) {
                    activeTouches[touch.identifier] = { target: hit };
                    triggerHaptic('medium');
                } else { 
                    let n = {x: p.x, y: p.y}; screens.push(n); 
                    activeTouches[touch.identifier] = { target: n };
                    triggerHaptic('medium');
                }
            } else {
                const hit = players.find(pl => Math.hypot(pl.x - p.x, pl.y - p.y) < 0.1);
                if (hit) {
                    activeTouches[touch.identifier] = { target: hit };
                    triggerHaptic('medium');
                }
            }
        }
        render(players, screens, ballId);
        e.preventDefault();
    }, {passive: false});

    canvas.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const state = activeTouches[touch.identifier];
            if (state) {
                const r = canvas.getBoundingClientRect();
                state.target.x = Math.max(0, Math.min(1, (touch.clientX - r.left) / canvas.width));
                state.target.y = Math.max(0, Math.min(1, (touch.clientY - r.top) / canvas.height));
            }
        }
        render(players, screens, ballId);
    });

    canvas.addEventListener('touchend', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            delete activeTouches[e.changedTouches[i].identifier];
        }
        render(players, screens, ballId);
    });

    function toggleRec() {
        triggerHaptic('medium');
        isRec = !isRec;
        const btn = document.getElementById('rec-btn');
        btn.innerText = isRec ? "⏹ СТОП" : "⏺ ЗАПИСЬ";
        btn.style.background = isRec ? "#e74c3c" : "#333";
        if (!isRec && recordedFrames.length > 0) {
            document.getElementById('player-controls').style.display = "flex";
            document.getElementById('timeline').max = recordedFrames.length - 1;
        }
    }

    setInterval(() => { 
        if(isRec) recordedFrames.push({ pos: JSON.parse(JSON.stringify(players)), scs: JSON.parse(JSON.stringify(screens)), bId: ballId }); 
    }, 40);

    function togglePlay() {
        triggerHaptic('light');
        isPlay = !isPlay;
        if (isPlay) {
            const anim = setInterval(() => {
                if (currentIdx < recordedFrames.length && isPlay) {
                    const f = recordedFrames[currentIdx];
                    render(f.pos, f.scs, f.bId);
                    document.getElementById('timeline').value = currentIdx;
                    currentIdx++;
                } else { clearInterval(anim); isPlay = false; if(currentIdx >= recordedFrames.length) currentIdx = 0; }
            }, 40);
        }
    }

    function seek(v) { currentIdx = parseInt(v); if(recordedFrames[currentIdx]) { const f = recordedFrames[currentIdx]; render(f.pos, f.scs, f.bId); } }

    function saveData() {
        triggerHaptic('success');
        if (recordedFrames.length === 0) return tg.showAlert("Запишите движение!");
        tg.sendData(JSON.stringify({ frames: recordedFrames }));
        tg.close();
    }

    window.onload = () => {
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        const hash = window.location.hash;
        if (hash.includes('data=')) {
            recordedFrames = JSON.parse(decodeURIComponent(hash.split('data=')[1])).frames;
            document.getElementById('player-controls').style.display = "flex";
            document.getElementById('rec-btn').style.display = "none";
            seek(0);
        } else { render(players, screens, ballId); }
    };
</script>
</body>
</html>
