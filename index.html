<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #1a3d2b; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #canvas-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        canvas { display: block; flex-grow: 1; }
        #controls { height: 70px; background: #111; display: flex; align-items: center; justify-content: center; border-top: 1px solid #333; }
        button { 
            padding: 12px 25px; border-radius: 10px; border: none; 
            background: #f39c12; color: white; font-weight: bold; font-size: 16px; 
            box-shadow: 0 4px 0 #d35400; cursor: pointer;
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #d35400; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="court"></canvas>
        <div id="controls"><button onclick="sendData()">💾 СОХРАНИТЬ ТАКТИКУ</button></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('court');
        const ctx = canvas.getContext('2d');
        
        let players = [
            { id: 1, x: 0.5, y: 0.85, color: '#e74c3c', label: '1', pos: 'PG' },
            { id: 2, x: 0.25, y: 0.7, color: '#e74c3c', label: '2', pos: 'SG' },
            { id: 3, x: 0.75, y: 0.7, color: '#e74c3c', label: '3', pos: 'SF' },
            { id: 4, x: 0.3, y: 0.45, color: '#e74c3c', label: '4', pos: 'PF' },
            { id: 5, x: 0.7, y: 0.45, color: '#e74c3c', label: '5', pos: 'C' }
        ];

        function drawCourt() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.strokeStyle = "rgba(255,255,255,0.8)";
            ctx.lineWidth = 3;

            // Аут
            ctx.strokeRect(10, 10, w - 20, h - 20);
            // Центральная линия
            ctx.beginPath(); ctx.moveTo(10, h/2); ctx.lineTo(w-10, h/2); ctx.stroke();
            // Центральный круг
            ctx.beginPath(); ctx.arc(w/2, h/2, 50, 0, Math.PI*2); ctx.stroke();
            // Трехсекундная зона (снизу)
            ctx.strokeRect(w/2 - 60, h - 160, 120, 150);
            // Линия штрафного (дуга)
            ctx.beginPath(); ctx.arc(w/2, h - 160, 60, Math.PI, 0); ctx.stroke();
            // Трехочковая линия (упрощенная дуга)
            ctx.beginPath(); ctx.arc(w/2, h - 50, w/2 - 20, Math.PI, 0, true); ctx.stroke();
            // Кольцо и щит
            ctx.beginPath(); ctx.arc(w/2, h - 50, 10, 0, Math.PI*2); ctx.stroke();
            ctx.fillRect(w/2 - 20, h - 35, 40, 3);
        }

        function draw() {
            ctx.fillStyle = "#1a3d2b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawCourt();
            
            players.forEach(p => {
                const px = p.x * canvas.width;
                const py = p.y * canvas.height;
                ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI*2);
                ctx.fillStyle = p.color; ctx.fill();
                ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = "white"; ctx.font = "bold 15px Arial"; ctx.textAlign = "center";
                ctx.fillText(p.label, px, py + 5);
                ctx.font = "10px Arial"; ctx.fillText(p.pos, px, py + 35);
            });
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 70;
            draw();
        }

        let selectedPlayer = null;
        function getCoords(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX, y: clientY };
        }

        canvas.addEventListener('mousedown', e => {
            const c = getCoords(e);
            selectedPlayer = players.find(p => Math.hypot(p.x * canvas.width - c.x, p.y * canvas.height - c.y) < 30);
        });
        canvas.addEventListener('mousemove', e => {
            if (selectedPlayer) {
                const c = getCoords(e);
                selectedPlayer.x = c.x / canvas.width;
                selectedPlayer.y = c.y / canvas.height;
                draw();
            }
        });
        window.addEventListener('mouseup', () => selectedPlayer = null);
        canvas.addEventListener('touchstart', e => {
            const c = getCoords(e);
            selectedPlayer = players.find(p => Math.hypot(p.x * canvas.width - c.x, p.y * canvas.height - c.y) < 30);
        });
        canvas.addEventListener('touchmove', e => {
            if (selectedPlayer) {
                const c = getCoords(e);
                selectedPlayer.x = c.x / canvas.width;
                selectedPlayer.y = c.y / canvas.height;
                draw();
            }
        });
        window.addEventListener('touchend', () => selectedPlayer = null);
        window.addEventListener('resize', resize);
        
        function sendData() {
            tg.sendData(JSON.stringify(players));
            tg.close();
        }
        resize();
    </script>
</body>
</html>
