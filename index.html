<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const canvas = document.getElementById('court');
    const ctx = canvas.getContext('2d');
    
    let players = [
        { id: 1, x: 0.5, y: 0.85, label: '1' },
        { id: 2, x: 0.2, y: 0.75, label: '2' },
        { id: 3, x: 0.8, y: 0.75, label: '3' },
        { id: 4, x: 0.3, y: 0.55, label: '4' },
        { id: 5, x: 0.7, y: 0.55, label: '5' }
    ];

    let recordedFrames = [];
    let isRecording = false;
    let isPlaying = false;
    let currentFrameIdx = 0;
    let selectedPlayer = null;

    // ФУНКЦИЯ ОТРИСОВКИ
    function render(positions) {
        if (canvas.width === 0 || canvas.height === 0) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        positions.forEach(p => {
            const px = p.x * canvas.width;
            const py = p.y * canvas.height;
            
            ctx.beginPath();
            ctx.arc(px, py, 22, 0, Math.PI * 2);
            ctx.fillStyle = "#ff6b00";
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = "white";
            ctx.font = "bold 18px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(p.label, px, py);
        });
    }

    // ОПРЕДЕЛЕНИЕ КООРДИНАТ ДЛЯ ТЕЛЕФОНА
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        // Берем либо тач, либо мышь
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) / canvas.width,
            y: (clientY - rect.top) / canvas.height
        };
    }

    // ОБРАБОТЧИКИ (МЫШЬ + ТАЧ)
    const startAction = (e) => {
        if (isPlaying) return;
        const pos = getPos(e);
        selectedPlayer = players.find(p => Math.hypot(p.x - pos.x, p.y - pos.y) < 0.12);
        if (selectedPlayer) {
            tg.HapticFeedback.impactOccurred('medium');
        }
        if (e.cancelable) e.preventDefault();
    };

    const moveAction = (e) => {
        if (!selectedPlayer || isPlaying) return;
        const pos = getPos(e);
        selectedPlayer.x = Math.max(0, Math.min(1, pos.x));
        selectedPlayer.y = Math.max(0, Math.min(1, pos.y));
        render(players);
        if (e.cancelable) e.preventDefault();
    };

    const endAction = () => { selectedPlayer = null; };

    // Привязываем события
    canvas.addEventListener('mousedown', startAction);
    window.addEventListener('mousemove', moveAction);
    window.addEventListener('mouseup', endAction);

    canvas.addEventListener('touchstart', startAction, { passive: false });
    canvas.addEventListener('touchmove', moveAction, { passive: false });
    canvas.addEventListener('touchend', endAction, { passive: false });

    // ЗАПИСЬ И ПЛЕЕР (остаются без изменений)
    // ... (код кнопок rec-btn, play-btn такой же как раньше) ...

    function resize() {
        const wrapper = document.getElementById('court-wrapper');
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
        render(players);
    }

    // ИНИЦИАЛИЗАЦИЯ
    window.onload = () => {
        // Ждем немного, чтобы мобильный браузер "проснулся"
        setTimeout(() => {
            resize();
            const hash = window.location.hash;
            if (hash.includes('data=')) {
                const data = JSON.parse(decodeURIComponent(hash.split('data=')[1]));
                recordedFrames = data.frames;
                document.getElementById('player-controls').style.display = "flex";
                document.getElementById('rec-btn').style.display = "none";
                setupTimeline();
                render(recordedFrames[0]);
            }
        }, 200);
    };

    window.addEventListener('resize', resize);
</script>
