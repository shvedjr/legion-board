<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Legion Board</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #canvas-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        /* Площадка теперь вертикальная */
        #court-wrapper { 
            flex-grow: 1; position: relative; 
            background-image: url('basketbolnaya-ploshchadka.jpg'); 
            background-size: contain; /* Чтобы картинка вписалась целиком */
            background-repeat: no-repeat;
            background-position: center;
            background-color: #004d40; /* Цвет фона, если картинка узкая */
        }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #controls { 
            height: 80px; background: #1a1a1a; display: flex; 
            align-items: center; justify-content: space-around; border-top: 2px solid #333; 
            padding-bottom: env(safe-area-inset-bottom); /* Отступ для новых iPhone */
        }
        
        button { 
            padding: 12px 30px; border-radius: 10px; border: none; 
            color: white; font-weight: bold; font-size: 16px; cursor: pointer; 
        }
        .btn-record { background: #e74c3c; }
        .btn-record.active { background: #2ecc71; box-shadow: 0 0 15px #2ecc71; }
        .btn-save { background: #3498db; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="court-wrapper"><canvas id="court"></canvas></div>
        <div id="controls">
            <button id="recBtn" class="btn-record" onclick="toggleRecord()">⏺ ЗАПИСЬ</button>
            <button id="saveBtn" class="btn-save" onclick="sendData()">💾 СОХРАНИТЬ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('court');
        const ctx = canvas.getContext('2d');
        
        let isRecording = false;
        let animationData = [];
        
        // Начальные позиции игроков (уже под вертикальную ориентацию)
        let players = [
            { id: 1, x: 0.5, y: 0.9, label: '1' },
            { id: 2, x: 0.2, y: 0.8, label: '2' },
            { id: 3, x: 0.8, y: 0.8, label: '3' },
            { id: 4, x: 0.3, y: 0.6, label: '4' },
            { id: 5, x: 0.7, y: 0.6, label: '5' }
        ];

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            players.forEach(p => {
                const px = p.x * canvas.width;
                const py = p.y * canvas.height;
                
                // Тень
                ctx.beginPath(); ctx.arc(px + 2, py + 2, 20, 0, Math.PI*2);
                ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fill();

                // Игрок
                ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI*2);
                ctx.fillStyle = "#ff6b00"; ctx.fill();
                ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.stroke();
                
                // Номер
                ctx.fillStyle = "white"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center";
                ctx.fillText(p.label, px, py + 7);
            });
        }

        function toggleRecord() {
            isRecording = !isRecording;
            const btn = document.getElementById('recBtn');
            btn.innerText = isRecording ? "⏹ СТОП" : "⏺ ЗАПИСЬ";
            btn.classList.toggle('active');
            if (isRecording) {
                animationData = [];
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        setInterval(() => {
            if (isRecording) {
                animationData.push(players.map(p => ({x: p.x.toFixed(3), y: p.y.toFixed(3)})));
            }
        }, 150);

        let selected = null;
        function getCoords(e) {
            const t = e.touches ? e.touches[0] : e;
            const rect = canvas.getBoundingClientRect();
            return { x: (t.clientX - rect.left) / canvas.width, y: (t.clientY - rect.top) / canvas.height };
        }

        const start = e => {
            const c = getCoords(e);
            selected = players.find(p => Math.hypot(p.x - c.x, p.y - c.y) < 0.08);
            if(selected) tg.HapticFeedback.selectionChanged();
        };
        
        const move = e => {
            if (selected) {
                const c = getCoords(e);
                selected.x = Math.max(0, Math.min(1, c.x));
                selected.y = Math.max(0, Math.min(1, c.y));
                draw();
            }
        };

        canvas.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', () => selected = null);
        canvas.addEventListener('touchstart', start);
        window.addEventListener('touchmove', move);
        window.addEventListener('touchend', () => selected = null);

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            draw();
        }

        function sendData() {
            const result = {
                animation: animationData,
                final: players.map(p => ({label: p.label, x: p.x, y: p.y}))
            };
            tg.sendData(JSON.stringify(result));
            tg.close();
        }

        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
