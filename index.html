<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Legion Pro Board</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        
        #court-wrapper { 
            flex-grow: 1; position: relative; width: 100%;
            background-image: url('basketbolnaya-ploshchadka.jpg');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            background-color: #002d20;
            z-index: 1;
        }
        
        canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 10; /* Холст должен быть выше фона */
            touch-action: none;
        }

        #player-controls { 
            background: #1a1a1a; padding: 15px; display: none; flex-direction: column; gap: 10px;
            border-top: 1px solid #333; z-index: 20;
        }
        
        .row { display: flex; justify-content: space-around; align-items: center; }
        input[type=range] { flex-grow: 1; margin: 0 15px; accent-color: #ff6b00; }
        
        .btn { 
            padding: 15px 25px; border-radius: 10px; border: none; 
            background: #333; color: white; font-weight: bold; font-size: 14px;
            z-index: 30;
        }
        .btn-orange { background: #ff6b00; }
        
        #main-nav { 
            height: 90px; background: #111; display: flex; justify-content: space-around; 
            align-items: center; padding-bottom: env(safe-area-inset-bottom);
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="court-wrapper">
            <canvas id="court"></canvas>
        </div>
        
        <div id="player-controls">
            <div class="row">
                <span id="current-time">0.0s</span>
                <input type="range" id="timeline" min="0" value="0" step="1">
                <span id="total-time">0.0s</span>
            </div>
            <div class="row">
                <button class="btn btn-orange" id="play-btn">▶ PLAY</button>
                <button class="btn" id="reset-btn">⏪ СБРОС</button>
            </div>
        </div>

        <div id="main-nav">
            <button class="btn" id="rec-btn">⏺ ЗАПИСЬ</button>
            <button class="btn btn-orange" id="save-btn">💾 СОХРАНИТЬ</button>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('court');
    const ctx = canvas.getContext('2d');
    
    let players = [
        { id: 1, x: 0.5, y: 0.85, label: '1' },
        { id: 2, x: 0.2, y: 0.75, label: '2' },
        { id: 3, x: 0.8, y: 0.75, label: '3' },
        { id: 4, x: 0.3, y: 0.55, label: '4' },
        { id: 5, x: 0.7, y: 0.55, label: '5' }
    ];

    let recordedFrames = [];
    let isRecording = false;
    let isPlaying = false;
    let currentFrameIdx = 0;
    let selectedPlayer = null;

    function render(positions) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        positions.forEach(p => {
            const px = p.x * canvas.width;
            const py = p.y * canvas.height;
            
            ctx.beginPath();
            ctx.arc(px, py, 22, 0, Math.PI * 2);
            ctx.fillStyle = "#ff6b00";
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = "white";
            ctx.font = "bold 18px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p.label, px, py + 7);
        });
    }

    const getTouchPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        return {
            x: (touch.clientX - rect.left) / canvas.width,
            y: (touch.clientY - rect.top) / canvas.height
        };
    };

    // ГЛАВНЫЕ ОБРАБОТЧИКИ
    canvas.addEventListener('touchstart', (e) => {
        if (isPlaying) return;
        const pos = getTouchPos(e);
        selectedPlayer = players.find(p => Math.hypot(p.x - pos.x, p.y - pos.y) < 0.1);
        if (selectedPlayer) {
            tg.HapticFeedback.impactOccurred('medium');
        }
        e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        if (!selectedPlayer || isPlaying) return;
        const pos = getTouchPos(e);
        selectedPlayer.x = Math.max(0, Math.min(1, pos.x));
        selectedPlayer.y = Math.max(0, Math.min(1, pos.y));
        render(players);
        e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        selectedPlayer = null;
        e.preventDefault();
    }, { passive: false });

    // ЗАПИСЬ
    document.getElementById('rec-btn').onclick = function() {
        isRecording = !isRecording;
        if (isRecording) {
            recordedFrames = [];
            this.innerText = "⏹ СТОП";
            this.style.background = "#e74c3c";
            document.getElementById('player
