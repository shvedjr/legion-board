<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            touch-action: none;
        }
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1e3d2b; /* Темно-зеленый цвет на случай загрузки */
        }
        canvas { 
            display: block; 
            /* Ссылка на качественную баскетбольную площадку */
            background-image: url('https://i.pinimg.com/originals/ce/42/43/ce4243886561f9d510f214643034237d.png');
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            flex-grow: 1;
        }
        #controls { 
            height: 75px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 2px solid #333;
        }
        button { 
            padding: 14px 35px; 
            border-radius: 12px; 
            border: none; 
            background: #f39c12; /* Оранжевый цвет */
            color: white; 
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 0 #d35400;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:active { 
            transform: translateY(2px); 
            box-shadow: 0 2px 0 #d35400; 
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="court"></canvas>
        <div id="controls">
            <button onclick="sendData()">💾 СОХРАНИТЬ ТАКТИКУ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('court');
        const ctx = canvas.getContext('2d');
        
        // Масштабирование холста под экран
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 75;
            draw();
        }

        // Пятерка игроков с относительными координатами (0.0 - 1.0)
        let players = [
            { id: 1, x: 0.5, y: 0.82, color: '#e74c3c', label: '1', pos: 'PG' },
            { id: 2, x: 0.22, y: 0.65, color: '#e74c3c', label: '2', pos: 'SG' },
            { id: 3, x: 0.78, y: 0.65, color: '#e74c3c', label: '3', pos: 'SF' },
            { id: 4, x: 0.35, y: 0.35, color: '#e74c3c', label: '4', pos: 'PF' },
            { id: 5, x: 0.65, y: 0.35, color: '#e74c3c', label: '5', pos: 'C' }
        ];

        let selectedPlayer = null;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            players.forEach(p => {
                const px = p.x * canvas.width;
                const py = p.y * canvas.height;

                // Тень фишки
                ctx.beginPath();
                ctx.arc(px + 2, py + 2, 19, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fill();

                // Сама фишка
                ctx.beginPath();
                ctx.arc(px, py, 19, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.fill();
                ctx.stroke();

                // Номер игрока
                ctx.fillStyle = "white";
                ctx.font = "bold 15px Arial";
                ctx.textAlign = "center";
                ctx.fillText(p.label, px, py + 6);
                
                // Подпись позиции
                ctx.fillStyle = "white";
                ctx.font = "bold 11px Arial";
                ctx.fillText(p.pos, px, py + 32);
            });
        }

        // Логика перемещения (Мышь + Тач)
        function getCoords(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = canvas.getBoundingClientRect();
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handleStart(e) {
            const coords = getCoords(e);
            selectedPlayer = players.find(p => 
                Math.hypot(p.x * canvas.width - coords.x, p.y * canvas.height - coords.y) < 30
            );
        }

        function handleMove(e) {
            if (selectedPlayer) {
                const coords = getCoords(e);
                selectedPlayer.x = coords.x / canvas.width;
                selectedPlayer.y = coords.y / canvas.height;
                draw();
            }
        }

        function handleEnd() { 
            selectedPlayer = null; 
        }

        // Слушатели событий
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', handleStart);
        canvas.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        window.addEventListener('resize', resize);
        
        // Отправка данных боту
        function sendData() {
            // Передаем только нужные данные координат
            tg.sendData(JSON.stringify(players));
            tg.close();
        }

        resize();
    </script>
</body>
</html>
