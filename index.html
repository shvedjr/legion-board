<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #canvas-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        #court-wrapper { 
            flex-grow: 1; position: relative; 
            background-image: url('basketbolnaya-ploshchadka.jpg'); 
            background-size: cover; background-position: center;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #controls { 
            height: 80px; background: #111; display: flex; 
            align-items: center; justify-content: space-around; border-top: 1px solid #333; 
        }
        button { padding: 12px 20px; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; }
        .btn-record { background: #e74c3c; }
        .btn-record.active { background: #2ecc71; border: 2px solid white; }
        .btn-save { background: #f39c12; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="court-wrapper"><canvas id="court"></canvas></div>
        <div id="controls">
            <button id="recBtn" class="btn-record" onclick="toggleRecord()">⏺ ЗАПИСЬ</button>
            <button id="saveBtn" class="btn-save" onclick="sendData()">💾 СОХРАНИТЬ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('court');
        const ctx = canvas.getContext('2d');
        
        let isRecording = false;
        let animationData = [];
        let players = [
            { id: 1, x: 0.5, y: 0.85, label: '1' },
            { id: 2, x: 0.2, y: 0.7, label: '2' },
            { id: 3, x: 0.8, y: 0.7, label: '3' },
            { id: 4, x: 0.35, y: 0.5, label: '4' },
            { id: 5, x: 0.65, y: 0.5, label: '5' }
        ];

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            players.forEach(p => {
                const px = p.x * canvas.width;
                const py = p.y * canvas.height;
                ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI*2);
                ctx.fillStyle = "#e74c3c"; ctx.fill();
                ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = "white"; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
                ctx.fillText(p.label, px, py + 6);
            });
        }

        function toggleRecord() {
            isRecording = !isRecording;
            const btn = document.getElementById('recBtn');
            btn.innerText = isRecording ? "⏹ СТОП" : "⏺ ЗАПИСЬ";
            btn.classList.toggle('active');
            if (isRecording) animationData = [];
        }

        // Записываем данные реже (раз в 200мс) и округляем, чтобы не превысить лимит Telegram
        setInterval(() => {
            if (isRecording) {
                const frame = players.map(p => ({
                    x: Math.round(p.x * 1000) / 1000,
                    y: Math.round(p.y * 1000) / 1000
                }));
                animationData.push(frame);
            }
        }, 200);

        function getCoords(e) {
            const t = e.touches ? e.touches[0] : e;
            const rect = canvas.getBoundingClientRect();
            return { x: t.clientX - rect.left, y: t.clientY - rect.top };
        }

        let selected = null;
        const start = e => {
            const c = getCoords(e);
            selected = players.find(p => Math.hypot(p.x * canvas.width - c.x, p.y * canvas.height - c.y) < 30);
        };
        const move = e => {
            if (selected) {
                const c = getCoords(e);
                selected.x = Math.max(0, Math.min(1, c.x / canvas.width));
                selected.y = Math.max(0, Math.min(1, c.y / canvas.height));
                draw();
            }
        };

        canvas.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', () => selected = null);
        canvas.addEventListener('touchstart', start);
        window.addEventListener('touchmove', move);
        window.addEventListener('touchend', () => selected = null);

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            draw();
        }

        function sendData() {
            try {
                const btn = document.getElementById('saveBtn');
                btn.innerText = "ОТПРАВКА...";
                
                const result = {
                    animation: animationData,
                    final: players
                };
                
                // Проверка: Telegram принимает данные только строкой
                const stringData = JSON.stringify(result);
                
                if (stringData.length > 4096) {
                    // Если данных слишком много, пробуем отправить только финал
                    tg.sendData(JSON.stringify({ final: players, error: "too_much_data" }));
                } else {
                    tg.sendData(stringData);
                }
                
                tg.close();
            } catch (e) {
                alert("Ошибка сохранения: " + e.message);
            }
        }

        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
